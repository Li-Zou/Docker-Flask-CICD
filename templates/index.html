<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calculator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
        }

        .calc {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 520px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-top: 0;
            color: #333;
        }

        .display {
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 24px;
            text-align: right;
            padding: 12px;
            border-radius: 8px;
            min-height: 30px;
            word-break: break-all;
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input,
        select,
        button {
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            flex: 1;
            box-sizing: border-box;
        }

        button {
            background: #4a90d9;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #3a7bc0;
        }

        .error {
            color: #d33;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <div class="calc">
        <h1>🧮 Flask Calculator</h1>
        <div class="display" id="display">0</div>

        <div class="row">
            <input type="number" id="a" placeholder="Number A" step="any">
            <select id="op">
                <option value="add">+</option>
                <option value="sub">−</option>
                <option value="mul">×</option>
                <option value="div">÷</option>
            </select>
            <input type="number" id="b" placeholder="Number B" step="any">
        </div>

        <button style="width:100%" onclick="calculate()">Calculate</button>
        <div class="error" id="error"></div>
    </div>

    <script>
        async function calculate() {
            const a = document.getElementById("a").value;
            const b = document.getElementById("b").value;
            const op = document.getElementById("op").value;
            const display = document.getElementById("display");
            const errorEl = document.getElementById("error");

            errorEl.textContent = "";

            if (a === "" || b === "") {
                errorEl.textContent = "Please fill in both numbers";
                return;
            }

            try {
                const resp = await fetch("/calculate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ a: a, b: b, op: op })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    errorEl.textContent = data.error || "Calculation error";
                    display.textContent = "Error";
                    return;
                }
                display.textContent = data.result;
            } catch (e) {
                errorEl.textContent = "Network error: " + e.message;
                display.textContent = "Error";
            }
        }

        // Press Enter to calculate
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") calculate();
        });
    </script>
</body>

</html>
